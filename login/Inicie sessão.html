<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LOGIM BASÍCO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="Caixa">
    <h1>Inicia a sessão</h1>
    <label for="email" >E-mail</label>
    <input type="email" id="email" name="email" placeholder="Inise o email " required>
    <label for="senha">Senha</label>
    <input type="password" name="senha" id="senha" placeholder="Digite a tua senha" required maxlength="10">
    <button type="button">Entrar</button>
   </div>
</body>
</html>
