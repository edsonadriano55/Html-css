<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Login">
        <h1>Login da empresa</h1>
        <form action="login.html">
            <label for="nome" Nome:>Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o seu nome">
            <label for="email" E-mail>Email</label>
            <input type="email" id="email" name="email">
            <label for="senha" Senha>Criar uma senha</label>
            <input type="password" id="senha" name="senha">
            <input type="submit" value="Enviar">
        </form>
    </div>
</body>
</html>
